<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sedang offline</title>
<style>
  /* Self-contained on purpose: the SW serves this when nothing else loads. Copy values from tokens.css. */
  :root { --bg: REPLACE_PAGE_BG; --text: REPLACE_TEXT; --text-2: REPLACE_TEXT_SECONDARY; --accent: REPLACE_ACCENT; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: var(--bg); color: var(--text); text-align: center;
    font: 17px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Arial, sans-serif; }
  main { max-width: 360px; }
  h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.03em; margin: 0 0 8px; }
  p { color: var(--text-2); margin: 0 0 24px; }
  button { min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: 600 17px/1 inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Kamu sedang offline</h1>
  <p>Halaman ini belum tersimpan di perangkat. Sambungkan ke internet, lalu coba lagi.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
