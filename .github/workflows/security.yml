name: Security Scan

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  strix-scan:
    name: Strix AI Security Pentest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for diff-scope resolution

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            strix -n -t ./ --scan-mode quick --max-budget 10
          else
            echo "::warning ::LLM_API_KEY secret is not configured. Skipping automated Strix scan."
          fi

      - name: Fail unless the scan completed
        if: env.LLM_API_KEY != ''
        run: |
          if ls -d strix_runs/*/run.json 1> /dev/null 2>&1; then
            run_json=$(ls -t strix_runs/*/run.json | head -1)
            status=$(jq -r .status "$run_json")
            if [ "$status" != "completed" ]; then
              echo "Strix run status is '$status' - the scan did not complete. Raise --max-budget." >&2
              exit 1
            fi
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && env.LLM_API_KEY != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
